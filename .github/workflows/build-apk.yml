name: Zbuduj APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Budowanie APK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: PysznaBasia-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Przygotuj plik
        run: cp app/build/outputs/apk/debug/app-debug.apk PysznaBasia.apk

      - name: Opublikuj APK do pobrania
        uses: softprops/action-gh-release@v2
        with:
          tag_name: najnowsza
          name: Pyszna Basia – najnowsza wersja
          body: Pobierz plik PysznaBasia.apk i zainstaluj go na telefonie.
          make_latest: true
          files: PysznaBasia.apk
